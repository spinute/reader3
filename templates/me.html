<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My page · Reader 3</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f6f8; color: #20242a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .shell { max-width: 880px; margin: 0 auto; padding: 36px 24px 70px; }
        .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
        .back { color: #5d6672; text-decoration: none; font-size: .86rem; }
        h1 { margin: 0; font-size: 1.55rem; }
        .saved { margin-left: auto; color: #218657; opacity: 0; transform: translateY(3px); transition: .2s ease; font-size: .8rem; }
        .saved.visible { opacity: 1; transform: none; }
        .section-title { margin: 28px 0 10px; font-size: .86rem; color: #636d78; text-transform: uppercase; letter-spacing: .06em; }
        .card { margin-bottom: 12px; padding: 18px; border: 1px solid #e0e3e7; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.035); }
        .card h2 { margin: 0 0 14px; font-size: .98rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; color: #59636f; font-size: .73rem; font-weight: 650; }
        input, textarea { width: 100%; margin-top: 5px; padding: 9px 10px; border: 1px solid #cdd3da; border-radius: 7px; background: #fff; color: #20242a; font: .84rem inherit; outline: none; }
        input:focus, textarea:focus { border-color: #6e91c7; box-shadow: 0 0 0 3px rgba(74,124,198,.12); }
        textarea { min-height: 82px; resize: vertical; }
        .wide { grid-column: 1 / -1; }
        .note { margin: 12px 0 0; color: #7a838e; font-size: .72rem; line-height: 1.5; }
        .prompt-form { display: grid; grid-template-columns: 180px 1fr auto; align-items: end; gap: 10px; }
        button { border: 1px solid #cbd1d8; border-radius: 7px; background: #fff; color: #303943; cursor: pointer; padding: 9px 12px; font-weight: 650; }
        button:hover { background: #f3f5f7; }
        .prompt-item { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #f5f6f8; }
        .prompt-item strong { min-width: 130px; font-size: .8rem; }
        .prompt-item span { flex: 1; overflow: hidden; color: #69727d; text-overflow: ellipsis; white-space: nowrap; font-size: .76rem; }
        .prompt-item button { padding: 4px 8px; border: 0; background: transparent; color: #7b8490; }
        #apple-status { margin: 0; color: #68727e; font-size: .8rem; }
        @media (max-width: 680px) { .grid, .prompt-form { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
    </style>
</head>
<body>
    <main class="shell">
        <div class="topbar">
            <a class="back" href="/">← Library</a>
            <h1>My page</h1>
            <span id="saved" class="saved">Saved</span>
        </div>

        <div class="section-title">API providers</div>
        <section class="card">
            <h2>OpenAI</h2>
            <div class="grid">
                <label>Model<input id="openai-model" autocomplete="off"></label>
                <label>API token<input id="openai-token" type="password" autocomplete="off"></label>
            </div>
        </section>
        <section class="card">
            <h2>Anthropic</h2>
            <div class="grid">
                <label>Model<input id="anthropic-model" autocomplete="off"></label>
                <label>API token<input id="anthropic-token" type="password" autocomplete="off"></label>
            </div>
        </section>
        <section class="card">
            <h2>Google Gemini</h2>
            <div class="grid">
                <label>Model<input id="google-model" autocomplete="off"></label>
                <label>API token<input id="google-token" type="password" autocomplete="off"></label>
            </div>
        </section>
        <section class="card">
            <h2>OpenAI-compatible / Ollama</h2>
            <div class="grid">
                <label>Model<input id="compatible-model" autocomplete="off"></label>
                <label>API token (optional)<input id="compatible-token" type="password" autocomplete="off"></label>
                <label class="wide">Base URL<input id="compatible-url" type="url" autocomplete="off"></label>
            </div>
        </section>
        <section class="card">
            <h2>Apple Foundation Model</h2>
            <p id="apple-status">Checking availability…</p>
        </section>
        <p class="note">Tokens stay in this browser's local storage and are sent only to the local Reader 3 server when you make a request.</p>

        <div class="section-title">Custom prompt buttons</div>
        <section class="card">
            <div class="prompt-form">
                <label>Button label<input id="prompt-name" maxlength="40" placeholder="Find assumptions"></label>
                <label>Instruction<textarea id="prompt-text" maxlength="2000"></textarea></label>
                <button type="button" onclick="addPrompt()">Add</button>
            </div>
            <div id="prompt-list"></div>
        </section>
    </main>
    <script>
        const settingsKey = "reader3.ai.settings.v1";
        const defaults = {
            provider: "chatgpt-web",
            models: {
                openai: "gpt-5.6-terra",
                anthropic: "claude-sonnet-5",
                google: "gemini-3.5-flash",
                "openai-compatible": "llama3.2",
                "apple-foundation": "on-device",
            },
            tokens: {openai: "", anthropic: "", google: "", "openai-compatible": ""},
            baseUrls: {"openai-compatible": "http://127.0.0.1:11434/v1"},
            customPrompts: [],
        };
        function loadSettings() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(settingsKey)) || {}; } catch (_) {}
            const settings = {...defaults, ...saved};
            settings.models = {...defaults.models, ...(saved.models || {})};
            settings.tokens = {...defaults.tokens, ...(saved.tokens || {})};
            settings.baseUrls = {...defaults.baseUrls, ...(saved.baseUrls || {})};
            settings.customPrompts = Array.isArray(saved.customPrompts) ? saved.customPrompts : [];
            if (settings.provider === "gemini-chrome") settings.provider = "chatgpt-web";
            return settings;
        }
        let settings = loadSettings();
        let savedTimer;
        function persist() {
            localStorage.setItem(settingsKey, JSON.stringify(settings));
            const saved = document.getElementById("saved");
            saved.classList.add("visible");
            clearTimeout(savedTimer);
            savedTimer = setTimeout(() => saved.classList.remove("visible"), 1200);
        }
        const fields = {
            "openai-model": ["models", "openai"], "openai-token": ["tokens", "openai"],
            "anthropic-model": ["models", "anthropic"], "anthropic-token": ["tokens", "anthropic"],
            "google-model": ["models", "google"], "google-token": ["tokens", "google"],
            "compatible-model": ["models", "openai-compatible"],
            "compatible-token": ["tokens", "openai-compatible"],
            "compatible-url": ["baseUrls", "openai-compatible"],
        };
        for (const [id, [group, key]] of Object.entries(fields)) {
            const input = document.getElementById(id);
            input.value = settings[group][key] || "";
            input.addEventListener("input", () => { settings[group][key] = input.value.trim(); persist(); });
        }
        function renderPrompts() {
            const list = document.getElementById("prompt-list");
            list.replaceChildren();
            for (const prompt of settings.customPrompts) {
                const row = document.createElement("div");
                const name = document.createElement("strong");
                const text = document.createElement("span");
                const remove = document.createElement("button");
                row.className = "prompt-item";
                name.textContent = prompt.name;
                text.textContent = prompt.instruction;
                remove.textContent = "×";
                remove.title = "Remove";
                remove.onclick = () => { settings.customPrompts = settings.customPrompts.filter(item => item.id !== prompt.id); persist(); renderPrompts(); };
                row.append(name, text, remove);
                list.appendChild(row);
            }
        }
        function addPrompt() {
            const name = document.getElementById("prompt-name");
            const instruction = document.getElementById("prompt-text");
            if (!name.value.trim() || !instruction.value.trim()) return;
            settings.customPrompts.push({
                id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
                name: name.value.trim(), instruction: instruction.value.trim(),
            });
            name.value = "";
            instruction.value = "";
            persist();
            renderPrompts();
        }
        renderPrompts();
        fetch("/api/llm/status").then(response => response.json()).then(status => {
            const apple = status.apple_foundation || {};
            document.getElementById("apple-status").textContent = apple.available ? "Available on this Mac" : (apple.reason || "Unavailable");
        }).catch(() => document.getElementById("apple-status").textContent = "Availability check failed");
    </script>
</body>
</html>
